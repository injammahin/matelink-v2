<!DOCTYPE html>
<html>
<head><title>Process Logo</title></head>
<body>
<img id="orig" src="assets/logo.jpeg" crossorigin="anonymous">
<canvas id="c1"></canvas>
<canvas id="c2"></canvas>
<script>
window.onload = function() {
  const img = document.getElementById('orig');
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  
  // 1. Transparent original
  const c1 = document.getElementById('c1');
  c1.width = w;
  c1.height = h;
  const ctx1 = c1.getContext('2d');
  ctx1.drawImage(img, 0, 0);
  const imgData1 = ctx1.getImageData(0, 0, w, h);
  const data1 = imgData1.data;
  
  // 2. White / Dark Mode version
  const c2 = document.getElementById('c2');
  c2.width = w;
  c2.height = h;
  const ctx2 = c2.getContext('2d');
  ctx2.drawImage(img, 0, 0);
  const imgData2 = ctx2.getImageData(0, 0, w, h);
  const data2 = imgData2.data;
  
  for (let i = 0; i < data2.length; i += 4) {
    const r = data2[i];
    const g = data2[i+1];
    const b = data2[i+2];
    
    // Check if background (white/near-white)
    if (r > 235 && g > 235 && b > 235) {
      data1[i+3] = 0; // transparent
      data2[i+3] = 0; // transparent
    } else {
      // For data1 (transparent original), keep colors
      // For data2 (dark mode version):
      // Check if it's the dark navy color (r < 50, g < 80, b < 130 and not teal)
      // Teal has high green/blue (e.g. g > 120, b > 140)
      const isTeal = (g > 100 && b > 120 && g > r);
      if (!isTeal) {
        // This is the dark navy part (M, MATELINK text) -> convert to crisp white
        data2[i] = 255;
        data2[i+1] = 255;
        data2[i+2] = 255;
      }
    }
  }
  
  ctx1.putImageData(imgData1, 0, 0);
  ctx2.putImageData(imgData2, 0, 0);
  
  window.dataUrlLight = c1.toDataURL('image/png');
  window.dataUrlDark = c2.toDataURL('image/png');
  document.body.setAttribute('data-done', 'true');
};
</script>
</body>
</html>
